<div class="auth-switch"><button id="login-tab" class="active" type="button">账户登录</button><button id="register-tab" type="button">注册账户</button></div>
<form id="register-form" hidden><label>姓名<input name="name" autocomplete="name" maxlength="40" required placeholder="用于个人首页与团队分工"></label><label>邮箱地址<input name="email" type="email" autocomplete="username" maxlength="254" required placeholder="用于登录与验证身份"></label><label>设置密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="至少 8 位，包含字母和数字"></label><label>确认密码<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="再次输入密码"></label><div class="login-error" id="register-error" role="alert" hidden></div><div class="registration-note">注册后请验证邮箱。管理员批准加入团队后，即可查看任务并提交成果。</div><button class="primary login-submit" id="register-submit" type="submit" disabled>注册账户 <span>→</span></button></form>
<section id="pending-panel" hidden><div class="pending-symbol">◇</div><h3 id="pending-heading">正在确认团队访问权限</h3><p id="pending-copy"></p><form id="request-access-form" hidden><label>你的姓名<input name="name" maxlength="40" required placeholder="请填写真实姓名"></label><button class="primary" type="submit">提交加入申请</button></form><div class="pending-actions"><button type="button" class="secondary" id="check-access">刷新申请状态</button><button type="button" class="text-button" id="pending-sign-out">退出账户</button></div><p class="pending-foot">申请通过后，这里会自动进入你的个人工作台。</p></section>
